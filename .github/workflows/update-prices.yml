name: Update commodity prices

on:
  schedule:
    # Runs once a day at 07:00 UTC. Adjust the cron if you want a
    # different time — GitHub can delay scheduled runs by a few minutes.
    - cron: '0 7 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest metal prices
        env:
          METALS_API_KEY: ${{ secrets.METALS_API_KEY }}
        run: node scripts/fetch-prices.js

      - name: Commit updated prices.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git diff --staged --quiet || git commit -m "Update commodity prices"
          git push
